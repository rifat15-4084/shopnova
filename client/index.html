<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="ShopNova — a modern online store for electronics, fashion, home and more. Free shipping over $100, cash on delivery available."
    />
    <title>ShopNova — Modern essentials, delivered</title>
    <link rel="preconnect" href="https://picsum.photos" crossorigin />
    <script>
      // Apply the saved theme before first paint to avoid a flash
      (function () {
        try {
          var stored = localStorage.getItem('shopnova-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored || (prefersDark ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
